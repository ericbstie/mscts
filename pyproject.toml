[project]
name = "mscts"
version = "0.0.0"
description = "Minecraft Server Compliancy Test Suite: differential parity and timing of custom servers against vanilla"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.format]
exclude = ["*.md"] # docs hold signature sketches, not runnable code

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # licensing is repo-level, not per-file headers
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = [
    "T201", # CLI tools report to stdout/stderr; that is their interface
]
"tests/**" = [
    "S101",    # pytest asserts
    "D1",      # test names are the documentation
    "PLR2004", # expected values are literals by design
    "INP001",  # tests are collected with --import-mode=importlib, not as a package
    "S603",    # reference-tier tests run the argv the code under test built; no untrusted input
    "S311",    # a seeded random.Random builds reproducible test data; it never signs or secures anything
]
"src/mscts/codec/regen.py" = [
    "T201", # the first CLI-shaped module in src/: print is its user-facing check/--write output
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--strict-config", "-ra", "-q", "--import-mode=importlib"]
testpaths = ["tests"]
# `tests/` itself, so plain helpers (tests/support/) import as top-level packages
# ("import support"), independent of pytest's own importlib-mode package synthesis.
pythonpath = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
# Async tests opt in with @pytest.mark.asyncio; every test gets its own event loop.
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# A hang (a stuck probe, a server that never answers) fails the test instead of stalling
# the run. 120 s is generous for the reference tier: a vanilla boot is ~10 s, so this
# covers a slow boot under concurrent load with headroom. A test that legitimately needs
# more (e.g. two full boot/stop cycles) overrides it with @pytest.mark.timeout(...).
timeout = 120
markers = [
    "reference: needs a live vanilla Reference Instance",
    "candidate: needs a live Candidate Instance",
    "statistical: opt-in, slow; statistical Scenarios run N times (ADR-0006)",
]
