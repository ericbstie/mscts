name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # macOS platform failures: #143 (procfs) and #144 (loopback hosts).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          install: false
      - run: mise install
      - run: mise run sync
      - name: Set Git identity for temporary test commits
        run: |
          git config --global user.name 'mscts CI'
          git config --global user.email 'ci@example.invalid'
      - run: mise run check
