# Tool versions and dev tasks. `mise install` then `mise run check`.
[tools]
python = "3.13.15"
uv = "0.12.19"
java = "temurin-25" # runs the vanilla Reference server (Target 26.3 needs Java 25)

[env]
UV_PYTHON_DOWNLOADS = "never" # use the mise-pinned interpreter

[tasks.sync]
description = "Install locked dependencies into .venv"
run = "uv sync --locked"

[tasks.fix]
description = "Apply formatter and autofixable lint"
run = ["uv run ruff format", "uv run ruff check --fix"]

[tasks.lint]
description = "Format check + ruff (ALL rules)"
run = ["uv run ruff format --check", "uv run ruff check"]

[tasks.types]
description = "ty, every diagnostic an error"
run = "uv run ty check"

[tasks.sec]
description = "bandit over src/"
run = "uv run bandit -q -c pyproject.toml -r src"

[tasks.test]
description = "unit tier, parallelized across CPUs (pytest-xdist)"
run = "uv run pytest -m 'not reference and not candidate and not statistical' -n auto"

[tasks.check]
description = "Everything a commit must pass"
depends = ["lint", "types", "sec", "test"]

[tasks.commit]
description = "THE way to commit: mise run check, and `git commit` only if it exited 0"
run = "uv run python3 scripts/commit_green.py --"

[tasks."install:reference"]
description = "Install the Reference (vanilla) into the shared cache; a no-op that says so if installed"
run = "uv run mscts adapter install vanilla"

[tasks."test:reference"]
description = "reference tier (live vanilla Instance)"
run = "uv run pytest -m reference"

[tasks."test:candidate"]
description = "candidate tier (live Candidate Instance)"
run = "uv run pytest -m candidate"

[tasks."test:statistical"]
description = "statistical tier (opt-in, slow; ADR-0006)"
run = "uv run pytest -m statistical"

[tasks."regen:packets"]
description = "Regenerate and verify the committed packets.json (--write to update it); needs install:reference"
run = "uv run python -m mscts.codec.regen"
